[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-generator-cli"
version = "0.1.0"
description = "Local-first Python CLI that generates invoice PDFs from client info and line items, with JSON drafts and CSV export."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Asdale Dynamics, LLC" }]
license = { text = "MIT" }
dependencies = ["reportlab>=3.5"]

[project.scripts]
invoice-cli = "invoice_generator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["invoice_generator"]
